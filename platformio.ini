; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
core_dir = .platformio
description = Firmware for ESP82xx/ESP32/ESP32-S2/ESP32-S3/ESP32-C3 for easy IoT deployment of sensors.
boards_dir = boards
lib_dir = lib
build_cache_dir = .cache
extra_configs = 
	platformio_core_defs.ini
	platformio_esp82xx_base.ini
	platformio_esp82xx_envs.ini
	platformio_esp32_envs.ini
	platformio_esp32_solo1.ini
	platformio_esp32s2_envs.ini
	platformio_esp32s3_envs.ini
	platformio_special_envs.ini
	platformio_esp32c2_envs.ini
	platformio_esp32c3_envs.ini
	platformio_esp32c5_envs.ini
	platformio_esp32c6_envs.ini
	platformio_esp32c61_envs.ini
	platformio_esp32p4_envs.ini
default_envs = max_ESP32_16M8M

[compiler_warnings]
build_flags = -Wall -Wno-parentheses -fdiagnostics-show-option

[minimal_size]
build_flags = 
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-s

[espota]
upload_protocol = espota
upload_flags_esp8266 = 
	--port=18266
upload_flags_esp32 = 
	--port=3232
build_flags = -DFEATURE_ARDUINO_OTA=1
upload_port = 192.168.1.152

[debug_flags]
build_flags = 

[mqtt_flags]
build_flags = -DMQTT_MAX_PACKET_SIZE=1024

[extra_scripts_default]
extra_scripts = pre:tools/pio/install-requirements.py
	pre:tools/pio/set-ci-defines.py
	pre:tools/pio/generate-compiletime-defines.py

[extra_scripts_esp8266]
extra_scripts = pre:tools/pio/remove_concat_cpp_files.py
	pre:tools/pio/concat_cpp_files.py
	${extra_scripts_default.extra_scripts}
	post:tools/pio/gzip-firmware.py
	post:tools/pio/copy_files.py

[common]
lib_archive = no
lib_ldf_mode = chain
lib_compat_mode = strict
shared_libdeps_dir = lib
framework = arduino
upload_speed = 115200
monitor_speed = 115200
targets = 

[env]
extends = common

[esp82xx_defaults]
build_flags = -D NDEBUG
	-DESP8266
	-lstdc++ -lsupc++
	-mtarget-align
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-DVTABLES_IN_FLASH
	-DPUYA_SUPPORT=1
	-DDISABLE_SC16IS752_SPI
	-DCRON_USE_LOCAL_TIME
	-fno-strict-aliasing
	-I$PROJECT_DIR/src/include
	-include "ESPEasy_config.h"
lib_ignore = ESP32_ping
	ESP32WebServer
	ESP32HTTPUpdateServer
	ServoESP32
	IRremoteESP8266
	HeatpumpIR
	TinyWireM
	ESP8266SdFat
	SD(esp8266)
	SD
	SDFS
	LittleFS(esp8266)
	LittleFS
	ArduinoOTA
	ESP8266mDNS
	I2C AXP192 Power management

[esp82xx_2_7_x]
build_flags = -DNDEBUG
	-DESP8266
	-mtarget-align
	-DVTABLES_IN_FLASH
	-fno-exceptions
	-lstdc++
	-DPIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK22x_190703
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH_LOW_FLASH
	-DPUYA_SUPPORT=1
	-DCORE_POST_2_5_0
	-DDISABLE_SC16IS752_SPI
	-DCRON_USE_LOCAL_TIME
	-fno-strict-aliasing
	-DLIBRARIES_NO_LOG=1
	-DNO_GLOBAL_I2S
	-I$PROJECT_DIR/src/include
	-include "ESPEasy_config.h"
	-Os
	-s
	-DBEARSSL_SSL_BASIC
	-DCORE_POST_2_6_0
	-DPR_9453_FLUSH_TO_CLEAR=flush
	-DPSTR_ALIGN=1
	-Werror=return-type
build_unflags = ${esp82xx_common.build_unflags}
lib_ignore = ${esp82xx_defaults.lib_ignore}
	EspSoftwareSerial

[esp82xx_3_0_x]
build_flags = ${esp82xx_2_7_x.build_flags}
	-DCORE_POST_3_0_0
	-DESP8266
	-Wno-deprecated-declarations
build_unflags = -DDEBUG_ESP_PORT
	-fexceptions
	-Wall
lib_ignore = ${esp82xx_defaults.lib_ignore}
extra_scripts = pre:tools/pio/pre_custom_esp8266_toolchain.py

[core_2_7_4]
extends = esp82xx_2_7_x
platform = espressif8266@2.6.3
platform_packages = framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git#2.7.4
build_flags = ${esp82xx_2_7_x.build_flags}
	-DPIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK22x_190703
	-DUSES_LATEST_SOFTWARE_SERIAL_LIBRARY=0
	-Wno-deprecated-declarations
	-DLIBRARIES_NO_LOG=1
lib_ignore = ${esp82xx_2_7_x.lib_ignore}
build_unflags = ${esp82xx_2_7_x.build_unflags}
extra_scripts = ${esp82xx_common.extra_scripts}

[core_stage]
extends = esp82xx_3_0_x
platform = espressif8266@4.2.1
platform_packages = 
build_flags = ${esp82xx_3_0_x.build_flags}
	-DPIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK3
	-DUSES_LATEST_SOFTWARE_SERIAL_LIBRARY=1
	-DLIBRARIES_NO_LOG=1
	-DFP_IN_IRAM
	-DPHASE_LOCKED_WAVEFORM
build_unflags = ${esp82xx_3_0_x.build_unflags}
lib_ignore = ${esp82xx_defaults.lib_ignore}
extra_scripts = ${esp82xx_common.extra_scripts}

[core_stage_2ndheap]
extends = esp82xx_3_0_x
platform = espressif8266@4.2.1
platform_packages = 
build_flags = ${esp82xx_3_0_x.build_flags}
	-DPIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK3
	-DUSES_LATEST_SOFTWARE_SERIAL_LIBRARY=1
	-DLIBRARIES_NO_LOG=1
	-DPHASE_LOCKED_WAVEFORM
	-DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
	-DUSE_SECOND_HEAP
build_unflags = ${esp82xx_3_0_x.build_unflags}
lib_ignore = ${core_stage.lib_ignore}
extra_scripts = ${esp82xx_common.extra_scripts}

[core_esp32_IDF5_5_1__3_3_3_LittleFS]
platform = https://github.com/Jason2866/platform-espressif32.git#Arduino/IDF55_gcc152
platform_packages = framework-arduinoespressif32 @ https://github.com/Jason2866/esp32-arduino-lib-builder/releases/download/2703-1841-5.5/framework-arduinoespressif32-release_v5.5-4e75642b.tar.xz
custom_remove_include = true
custom_component_remove = 
	espressif/esp_wifi_remote
	espressif/esp-dsp
	espressif/esp32-camera
	espressif/libsodium
	espressif/esp-modbus
	espressif/qrcode
	espressif/esp_insights
	espressif/esp_diag_data_store
	espressif/esp_diagnostics
	espressif/esp_rainmaker
	espressif/rmaker_common
build_flags = -DESP32_STAGE
	-DESP_IDF_VERSION_MAJOR=5
	-DLIBRARIES_NO_LOG=1
	-DDISABLE_SC16IS752_SPI
	-DETH_TYPE_JL1101_SUPPORTED=1
	-DETH_PHY_LAN867X_SUPPORTED=1
	-DPR_9453_FLUSH_TO_CLEAR=clear
	-DCONFIG_FREERTOS_USE_TICKLESS_IDLE=1
	-DCONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
	-DNEOPIXEL_ESP32_RMT_DEFAULT
	-DCRON_USE_LOCAL_TIME
	-I$PROJECT_DIR/src/include
	-include "sdkconfig.h"
	-include "ESPEasy_config.h"
	-include "esp32x_fixes.h"
	-DUPDATE_NOCRYPT
	-Os
	-DNO_GLOBAL_ESP_NOW
	-DNO_GLOBAL_EEPROM
	-DNO_GLOBAL_INSIGHTS
	-DNO_GLOBAL_NETBIOS
	-DNO_GLOBAL_OPENTHREAD
	-DNO_GLOBAL_MATTER
	-DNO_GLOBAL_ZIGBEE
	-DNO_GLOBAL_SPIFFS
	-DNO_GLOBAL_OPENTHREADCLI
	-DNO_GLOBAL_WIFIPROV
lib_ignore = BLE
	Zigbee
	ESP RainMaker
	ESP Insights
	Matter
	WiFiProv
	TFLite Micro
	ESP_SR
	NetBIOS
lib_extra_dirs = 
	lib/lib_ssl

